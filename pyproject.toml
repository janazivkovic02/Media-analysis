[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serbian-news-scraping"
version = "0.1.0"
description = "Scrapers and data processing for Serbian news articles."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "idna==3.16",
    "requests==2.34.2",
    "soupsieve==2.8.4",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
